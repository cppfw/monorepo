name: ci
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
    branches:
      - main
concurrency:
  # group by ref: a new push to a branch or pull request cancels the in-progress run of the
  # same branch or pull request. branch and tag builds do not share a group, so the tag build
  # priority is enforced by the tag-priority job instead (a concurrency group cancels the
  # older run, which would not give the tag build priority when the branch run starts later)
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tag-priority:
    # enforce that the tag build always wins over the branch build on the same commit,
    # regardless of the order in which the runs start:
    # - in a tag build: cancel the in-progress branch build on the same commit
    # - in a branch build: cancel this run when a tag build on the same commit is in progress
    # all the other jobs depend on this job, so the cancellation happens before the builds start
    if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    steps:
      - name: enforce tag build priority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=in_progress&per_page=100" --paginate \
                -q ".workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\" and .event == \"push\" and .name == \"ci\" and .head_branch != null and .head_branch != \"\") | .id"); do
              echo "cancelling in-progress branch build (run $id) on the same commit"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/$id/cancelations"
            done
          else
            for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=in_progress&per_page=100" --paginate \
                -q ".workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\" and .event == \"push\" and .name == \"ci\" and (.head_branch == null or .head_branch == \"\")) | .id"); do
              echo "a tag build (run $id) on the same commit is in progress; cancelling this branch build"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancelations"
              exit 0
            done
          fi
##### linux #####
  linux:
    needs: tag-priority
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config:
          - rel
          - dbg
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: linux - ${{ matrix.runner }} | ${{ matrix.config }}
    steps:
      - name: install build tools
        run: |
          sudo apt --quiet update --yes
          sudo apt --quiet install --yes build-essential cmake bison pkg-config git curl zip unzip tar procps
      - name: increase swap size
        run: |
          free -h
          sudo swapoff --all
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h
      - name: install build deps
        run: |
          sudo apt --quiet install --yes \
            libxmu-dev \
            libxi-dev \
            libgl-dev \
            libgles-dev \
            libglu1-mesa-dev \
            libgtk-4-dev \
            libpulse-dev \
            libltdl-dev \
            libx11-dev \
            libwayland-dev \
            libxkbcommon-dev \
            autoconf \
            autoconf-archive \
            automake \
            libtool
      - name: git clone
        uses: myci-actions/checkout@main
        with:
          submodules: true #  non-recursive, no remote
      - name: install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg-installation
          (cd vcpkg-installation; ./bootstrap-vcpkg.sh)
      - name: set VCPKG_ROOT
        uses: myci-actions/export-env-var@main
        with: {name: VCPKG_ROOT, value: "$(pwd)/vcpkg-installation"}
      - name: add VCPKG_ROOT to PATH
        uses: myci-actions/export-env-var@main
        with: {name: PATH, value: "$PATH:$VCPKG_ROOT"}
      - name: generate cmake build files
        run: |
          cmake build/cmake --preset ${{ matrix.config }}
      - name: check disk space
        run: df -h
      - name: build
        run: |
          cd build/cmake
          cmake --build --preset ${{ matrix.config }} --parallel $(nproc)
      - name: test
        run: |
          cd build/cmake
          cmake --build --preset ${{ matrix.config }} --target test --parallel $(nproc)
##### macosx #####
  macosx:
    needs: tag-priority
    # the full build on a macos runner takes about 55 minutes
    timeout-minutes: 90
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - rel
          - dbg
    steps:
    - name: workaround python2 and python3 issue when upgrading python
      run : |
        rm -rf /usr/local/bin/2to3*
        rm -rf /usr/local/bin/idle3*
        rm -rf /usr/local/bin/pydoc3*
        rm -rf /usr/local/bin/python3
        rm -rf /usr/local/bin/python3-config
        rm -rf /usr/local/bin/python3*
        rm -rf /usr/local/bin/python3*-config
    - name: git clone
      uses: myci-actions/checkout@main
      with:
        submodules: true #  non-recursive, no remote
    - name: install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git vcpkg-installation
        (cd vcpkg-installation; ./bootstrap-vcpkg.sh)
    - name: set VCPKG_ROOT
      uses: myci-actions/export-env-var@main
      with: {name: VCPKG_ROOT, value: "$(pwd)/vcpkg-installation"}
    - name: add VCPKG_ROOT to PATH
      uses: myci-actions/export-env-var@main
      with: {name: PATH, value: "$PATH:$VCPKG_ROOT"}
    - name: install ci tools
      run: brew install cmake
    - name: generate cmake build files
      run: |
        cmake build/cmake --preset ${{ matrix.config }}
    - name: build
      run: |
        cd build/cmake
        cmake --build --preset ${{ matrix.config }} --parallel $(sysctl -n hw.ncpu)
    - name: test
      run: |
        cd build/cmake
        cmake --build --preset ${{ matrix.config }} --target test --parallel $(sysctl -n hw.ncpu)
##### windows #####
  windows:
    needs: tag-priority
    timeout-minutes: 60
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    strategy:
      fail-fast: false
      matrix:
        config:
          - rel
          - dbg
        arch:
          - Win32
          - x64
    name: windows
    steps:
    - name: git clone
      uses: actions/checkout@v6
      with:
        submodules: true #  non-recursive, no remote
    - name: set VCPKG_ROOT
      uses: myci-actions/export-env-var-powershell@main
      # accorging to github actions windows image docs, it should define VCPKG_INSTALLATION_ROOT env var,
      # but on practice it is not set, so specify vcpkg root path explicitly
      with: {name: VCPKG_ROOT, value: "C:/vcpkg/"}
    - name: make local symbolic link to VCPKG installation directory
      # this is needed at least for actions/upload-artifact to be able to find vcpkg install logs
      shell: powershell
      run: New-Item -ItemType SymbolicLink -Path vcpkg-installation -Target $env:VCPKG_ROOT
    - name: generate cmake build files
      run: |
        cmake build/cmake --preset ${{ matrix.config }} -A ${{ matrix.arch }}
    - name: build
      run: |
        cd build/cmake
        cmake --build --preset ${{ matrix.config }} --parallel $env:NUMBER_OF_PROCESSORS
    - name: test
      run: |
        cd build/cmake
        cmake --build --preset ${{ matrix.config }} --target test --parallel $env:NUMBER_OF_PROCESSORS
    - name: upload vcpkg logs to artifacts
      if: always() # even if previous steps fail, this one needs to be run
      uses: actions/upload-artifact@v7
      with:
        name: windows_${{ matrix.arch }}_${{ matrix.config }}_logs
        # NOTE: upload only first level buildtrees subdir logs: on windows actions/upload-artifact fails with a stat() EPERM error when traversing too deep into dependency source trees
        path: |
          vcpkg-installation/buildtrees/*/*.log
          vcpkg-installation/buildtrees/*/*.txt
        if-no-files-found: warn
##### ios #####
  ios:
    needs: tag-priority
    timeout-minutes: 60
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - rel
          - dbg
    steps:
    - name: workaround python2 and python3 issue when upgrading python
      run : |
        rm -rf /usr/local/bin/2to3*
        rm -rf /usr/local/bin/idle3*
        rm -rf /usr/local/bin/pydoc3*
        rm -rf /usr/local/bin/python3
        rm -rf /usr/local/bin/python3-config
        rm -rf /usr/local/bin/python3*
        rm -rf /usr/local/bin/python3*-config
    - name: git clone
      uses: myci-actions/checkout@main
      with:
        submodules: true #  non-recursive, no remote
    - name: install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git vcpkg-installation
        (cd vcpkg-installation; ./bootstrap-vcpkg.sh)
    - name: set VCPKG_ROOT
      uses: myci-actions/export-env-var@main
